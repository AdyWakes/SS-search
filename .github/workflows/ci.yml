name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint (fmt, clippy, typecheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned so new clippy lints in future stable releases don't break CI unannounced.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit + integration tests (no models needed)
        run: cargo test -p shotfind-core

  model-tests:
    name: End-to-end with real models (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report unpinned model hashes
        run: node scripts/pin-models.mjs --check || echo "::warning::Some model downloads have no pinned SHA-256; the app will refuse them until pinned."
      - name: Verify pinned hashes against upstream
        run: node scripts/pin-models.mjs --verify
      - name: Fetch ONNX Runtime (pinned, SHA-256 verified)
        run: node scripts/fetch-onnxruntime.mjs
      - name: Download models via the app's own verified downloader
        run: cargo run --release -p shotfind-core --example fetch_models -- "$RUNNER_TEMP/appdata"
      - name: Tests that need real models
        env:
          SHOTFIND_MODELS_DIR: ${{ runner.temp }}/appdata/models
          ORT_DYLIB_PATH: ${{ github.workspace }}/src-tauri/resources/onnxruntime/libonnxruntime.so
        run: cargo test --release -p shotfind-core -- --ignored --nocapture
